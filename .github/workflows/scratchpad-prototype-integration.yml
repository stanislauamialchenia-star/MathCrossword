name: Scratchpad prototype integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'prototype/resizable-scratchpad' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v5
        with:
          ref: prototype/resizable-scratchpad

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply scratchpad patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-scratchpad-prototype.py')
          s = p.read_text()
          old = """    n = text.count(old)\n    if n != 1:\n        raise SystemExit(f'{label}: expected 1 match, got {n}')\n    text = text.replace(old, new, 1)"""
          new = """    n = text.count(old)\n    expected = 2 if label == 'clear scratchpad rect' else 1\n    if n != expected:\n        raise SystemExit(f'{label}: expected {expected} match(es), got {n}')\n    text = text.replace(old, new, 1)"""
          if old not in s:
              raise SystemExit('patch helper definition not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 tools/apply-scratchpad-prototype.py
          git diff --check

      - name: Compile prototype
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Commit tested prototype
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-scratchpad-prototype.yml tools/apply-scratchpad-prototype.py
          git add app/src/main/java/com/offline/mathcrossword/MainActivity.java
          git commit -m "Prototype resizable in-game scratchpad"
          git push origin HEAD:prototype/resizable-scratchpad
