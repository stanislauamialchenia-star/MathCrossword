name: Apply analysis wrapping patch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/analysis-wrap-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wrap long analysis summary lines
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/analysis_wrap_patch.py
          python3 /tmp/analysis_wrap_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/offline/mathcrossword/MainActivity.java
          git commit -m "Wrap long analysis summary lines"
          git push
