name: Build muted-label scratchpad preview

on:
  push:
    branches:
      - prototype/resizable-scratchpad
    paths:
      - .github/workflows/build-muted-label-preview.yml

permissions:
  contents: write

jobs:
  apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v5
        with:
          ref: prototype/resizable-scratchpad

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Compile both Android variants
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Build GitHub release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleGithubRelease --no-daemon
          apk_path="$(find app/build/outputs/apk/github/release -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcrossword-signing.keystore"
          chmod 600 "$RUNNER_TEMP/mathcrossword-signing.keystore"
          keytool -list -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Align and sign preview APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/zipalign" -f -p 4 "$APK_PATH" "$RUNNER_TEMP/preview-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/MathCrossword-scratchpad-muted-labels.apk" \
            "$RUNNER_TEMP/preview-aligned.apk"
          "$build_tools/apksigner" verify "$RUNNER_TEMP/MathCrossword-scratchpad-muted-labels.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MathCrossword-scratchpad-muted-labels
          path: ${{ runner.temp }}/MathCrossword-scratchpad-muted-labels.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary preview workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-muted-label-preview.yml
          git commit -m "Remove temporary muted-label preview workflow"
          git push origin HEAD:prototype/resizable-scratchpad

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mathcrossword-signing.keystore" "$RUNNER_TEMP/preview-aligned.apk" "$RUNNER_TEMP/MathCrossword-scratchpad-muted-labels.apk"
