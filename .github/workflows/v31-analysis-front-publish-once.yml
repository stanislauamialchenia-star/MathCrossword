name: Publish v31 trajectory analysis once

on:
  push:
    branches:
      - v27-ui-publish
    paths:
      - .github/workflows/v31-analysis-front-publish-once.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v31 patch
        run: |
          echo '' | base64 --decode > /tmp/v31_patch.py
          python3 /tmp/v31_patch.py
      - name: Commit v31 to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/offline/mathcrossword/SessionTracker.java app/src/main/java/com/offline/mathcrossword/MainActivity.java app/build.gradle V31_ANALYSIS_FRONT.md
          git commit -m 'MathCrossword v31: expose detailed solution trajectory'
          git push origin HEAD:main
