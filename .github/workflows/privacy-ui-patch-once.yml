name: Apply privacy UI patch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-ui-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch in-app privacy access
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/privacy_patch.py
          python3 /tmp/privacy_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/offline/mathcrossword/MainActivity.java
          git commit -m "Expose privacy policy inside app"
          git push
