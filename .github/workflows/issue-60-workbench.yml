name: Issue 60 solution workbench patch

on:
  push:
    branches:
      - ux/solution-workbench
    paths:
      - .github/workflows/issue-60-workbench.yml
      - .github/scripts/issue60_workbench_patch.py
      - .github/scripts/issue60_workbench_patch_v2.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ux/solution-workbench

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply focused UI patch
        run: python3 .github/scripts/issue60_workbench_patch_v2.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Compile GitHub debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGithubDebug --no-daemon

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offline/mathcrossword/MainActivity.java
          git diff --cached --exit-code && { echo "No implementation changes produced"; exit 1; } || true
          git commit -m "Implement solution workbench UX"
          git push origin HEAD:ux/solution-workbench
