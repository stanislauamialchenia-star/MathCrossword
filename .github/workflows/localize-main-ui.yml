name: Localize player UI safely

on:
  push:
    branches:
      - agent/first-run-player-layer
    paths:
      - tools/localize_main_activity.py
      - tools/localize_session_tracker.py
      - .github/workflows/localize-main-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v5
        with:
          ref: agent/first-run-player-layer
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply exact localization migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/localize_main_activity.py
          python3 tools/localize_session_tracker.py

      - name: Compile both distribution variants
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Commit only after successful compilation
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            app/src/main/java/com/offline/mathcrossword/MainActivity.java
            app/src/main/java/com/offline/mathcrossword/SessionTracker.java
            V33_LOCALIZATION_REMAINING.md
            V33_TRAJECTORY_LOCALIZATION_REMAINING.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "No generated localization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Localize player-facing analysis and trajectory text"
          git push origin HEAD:agent/first-run-player-layer
