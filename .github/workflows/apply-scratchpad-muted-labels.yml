name: Apply muted scratchpad labels

on:
  push:
    branches:
      - prototype/resizable-scratchpad
    paths:
      - tools/apply-scratchpad-muted-labels.py
      - .github/workflows/apply-scratchpad-muted-labels.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v5
        with:
          ref: prototype/resizable-scratchpad

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply persistent muted A-B-C labels
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-scratchpad-muted-labels.py
          git diff --check

      - name: Compile both Android variants
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Commit tested prototype change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-scratchpad-muted-labels.py .github/workflows/apply-scratchpad-muted-labels.yml
          git add app/src/main/java/com/offline/mathcrossword/MainActivity.java
          git commit -m "Keep scratchpad labels visible when closed"
          git push origin HEAD:prototype/resizable-scratchpad
