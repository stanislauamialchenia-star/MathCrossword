name: Build and publish debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$GRADLE_USER_HOME"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcrossword-signing.keystore"
          chmod 600 "$RUNNER_TEMP/mathcrossword-signing.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          {
            printf 'android.injected.signing.store.file=%s\n' "$RUNNER_TEMP/mathcrossword-signing.keystore"
            printf 'android.injected.signing.store.password=%s\n' "$STORE_PASSWORD"
            printf 'android.injected.signing.key.alias=%s\n' "$KEY_ALIAS"
            printf 'android.injected.signing.key.password=%s\n' "$KEY_PASSWORD"
          } > "$GRADLE_USER_HOME/gradle.properties"
          chmod 600 "$GRADLE_USER_HOME/gradle.properties"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          version_code="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify persistent APK signature
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          keytool -exportcert \
            -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/mathcrossword-signing-cert.der" > /dev/null
          expected_digest="$(sha256sum "$RUNNER_TEMP/mathcrossword-signing-cert.der" | cut -d ' ' -f 1)"
          actual_digest="$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test "$actual_digest" = "$expected_digest"

      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          apk_name="MathCrossword-v${{ steps.version.outputs.name }}-debug-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.name }}-debug.${{ github.run_number }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" "$APK_NAME#MathCrossword debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MathCrossword v${{ steps.version.outputs.name }} debug build ${{ github.run_number }}" \
            --notes "Automatic debug APK for version ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }}), built from commit $GITHUB_SHA."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mathcrossword-signing.keystore"
          rm -f "$RUNNER_TEMP/mathcrossword-signing-cert.der"
          rm -f "$GRADLE_USER_HOME/gradle.properties"
