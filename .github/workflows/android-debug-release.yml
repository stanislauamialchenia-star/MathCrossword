name: Build, verify and publish GitHub release APK

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle
      - app/src/main/AndroidManifest.xml
      - app/src/github/**
      - .github/workflows/android-debug-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          version_code="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build GitHub release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGithubRelease --no-daemon

      - name: Reliability smoke gate
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubRelease/compileGithubReleaseJavaWithJavac/classes"
          test -d "$app_classes"
          mkdir -p "$RUNNER_TEMP/mathcrossword-reliability"
          javac -cp "$app_classes" -d "$RUNNER_TEMP/mathcrossword-reliability" tools/ReliabilityHarness.java
          timeout 12m java -Xmx1536m -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" com.offline.mathcrossword.ReliabilityHarness smoke

      - name: Locate non-debug APK
        id: unsigned
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/github/release -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt_bin"
          if "$aapt_bin" dump badging "$apk_path" | grep -q 'application-debuggable'; then
            echo "Refusing to publish a debuggable APK" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcrossword-signing.keystore"
          chmod 600 "$RUNNER_TEMP/mathcrossword-signing.keystore"
          keytool -list -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Align and sign GitHub APK with persistent key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          APK_PATH: ${{ steps.unsigned.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          test -x "$apksigner"
          test -x "$zipalign"
          "$zipalign" -f -p 4 "$APK_PATH" "$RUNNER_TEMP/app-github-release-aligned.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/app-github-release-signed.apk" \
            "$RUNNER_TEMP/app-github-release-aligned.apk"
          mv "$RUNNER_TEMP/app-github-release-signed.apk" "$APK_PATH"
          "$zipalign" -c -p 4 "$APK_PATH"

      - name: Verify persistent APK signature
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          APK_PATH: ${{ steps.unsigned.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify "$APK_PATH"
          expected_digest="$(keytool -list -v -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual_digest="$(keytool -printcert -jarfile "$APK_PATH" | sed -n 's/^.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$expected_digest"
          test -n "$actual_digest"
          test "$actual_digest" = "$expected_digest"

      - name: Prepare stable release asset
        id: apk
        env:
          APK_PATH: ${{ steps.unsigned.outputs.path }}
        shell: bash
        run: |
          apk_name="MathCrossword.apk"
          cp "$APK_PATH" "$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Preserve signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathCrossword-v${{ steps.version.outputs.name }}-github-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.name }}-github.${{ github.run_number }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" "$APK_NAME#MathCrossword Android APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MathCrossword v${{ steps.version.outputs.name }}" \
            --notes "Direct Android distribution for version ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }}). Non-debug APK, persistently signed for in-place GitHub updates. Self-update is enabled only in this distribution. Deterministic reliability smoke gate passed."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            "$RUNNER_TEMP/app-github-release-aligned.apk" \
            "$RUNNER_TEMP/app-github-release-signed.apk"
          rm -rf "$RUNNER_TEMP/mathcrossword-reliability"
