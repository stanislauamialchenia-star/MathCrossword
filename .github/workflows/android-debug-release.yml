name: Build and publish debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          version_code="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          apk_name="MathCrossword-v${{ steps.version.outputs.name }}-debug-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.name }}-debug.${{ github.run_number }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" "$APK_NAME#MathCrossword debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MathCrossword v${{ steps.version.outputs.name }} debug build ${{ github.run_number }}" \
            --notes "Automatic debug APK for version ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }}), built from commit $GITHUB_SHA."
