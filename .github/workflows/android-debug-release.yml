name: Build and publish debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcrossword-signing.keystore"
          chmod 600 "$RUNNER_TEMP/mathcrossword-signing.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          version_code="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sign debug APK with persistent key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          zip -q -d app/build/outputs/apk/debug/app-debug.apk \
            'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/app-debug-signed.apk" \
            app/build/outputs/apk/debug/app-debug.apk
          mv "$RUNNER_TEMP/app-debug-signed.apk" app/build/outputs/apk/debug/app-debug.apk

      - name: Verify persistent APK signature
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          keytool -exportcert \
            -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/mathcrossword-signing-cert.der" > /dev/null
          expected_digest="$(sha256sum "$RUNNER_TEMP/mathcrossword-signing-cert.der" | cut -d ' ' -f 1)"
          mapfile -t actual_digests < <("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          test "${#actual_digests[@]}" -eq 1
          test "${actual_digests[0]}" = "$expected_digest"

      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          apk_name="MathCrossword-v${{ steps.version.outputs.name }}-debug-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.name }}-debug.${{ github.run_number }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" "$APK_NAME#MathCrossword debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MathCrossword v${{ steps.version.outputs.name }} debug build ${{ github.run_number }}" \
            --notes "Automatic debug APK for version ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }}), built from commit $GITHUB_SHA."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mathcrossword-signing.keystore"
          rm -f "$RUNNER_TEMP/mathcrossword-signing-cert.der"
          rm -f "$RUNNER_TEMP/app-debug-signed.apk"
