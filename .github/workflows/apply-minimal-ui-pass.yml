name: Apply minimal UI pass

on:
  push:
    branches:
      - product/minimal-ui-pass
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: product/minimal-ui-pass

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply visual hierarchy pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/offline/mathcrossword/MainActivity.java')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          # Palette: neutral surfaces + one muted green accent.
          replace_once('        final int bg = Color.rgb(238, 248, 235);',
                       '        // Minimal visual system: warm neutral surfaces, one muted green accent.\n        // Success/error colors stay semantic instead of acting as decoration.\n        final int bg = Color.rgb(246, 245, 241);')
          replace_once('        final int board = Color.rgb(255, 255, 255);', '        final int board = Color.rgb(255, 255, 253);')
          replace_once('        final int ink = Color.rgb(42, 45, 43);', '        final int ink = Color.rgb(39, 42, 40);')
          replace_once('        final int green = Color.rgb(211, 244, 186);', '        final int green = Color.rgb(229, 239, 226);')
          replace_once('        final int red = Color.rgb(255, 171, 160);', '        final int red = Color.rgb(249, 224, 221);')
          replace_once('        final int selected = Color.rgb(255, 244, 190);', '        final int selected = Color.rgb(232, 238, 231);')
          replace_once('        final int accent = Color.rgb(46, 136, 62);', '        final int accent = Color.rgb(62, 100, 72);')
          replace_once('        final int soft = Color.rgb(245, 251, 242);', '        final int soft = Color.rgb(250, 249, 246);')

          # Primary vs secondary button hierarchy.
          replace_once('            c.drawRoundRect(r, dp(16), dp(16), paint);', '            c.drawRoundRect(r, dp(14), dp(14), paint);')
          replace_once('            stroke.setStrokeWidth(dp(2));\n            stroke.setColor(filled ? accent : Color.rgb(80, 105, 82));\n            c.drawRoundRect(r, dp(16), dp(16), stroke);',
                       '            stroke.setStrokeWidth(dp(filled ? 1.6f : 1.1f));\n            stroke.setColor(filled ? accent : Color.rgb(174, 176, 171));\n            c.drawRoundRect(r, dp(14), dp(14), stroke);')
          replace_once('            paint.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);\n            paint.setTextAlign(Paint.Align.CENTER);\n            paint.setTextSize(dp(18));\n            Paint.FontMetrics fm = paint.getFontMetrics();\n            c.drawText(label, r.centerX(), r.centerY() - (fm.ascent + fm.descent) / 2f, paint);\n        }\n\n        void drawFreeSetup',
                       '            paint.setTypeface(filled ? android.graphics.Typeface.DEFAULT_BOLD : android.graphics.Typeface.DEFAULT);\n            paint.setTextAlign(Paint.Align.CENTER);\n            paint.setTextSize(dp(filled ? 18f : 17f));\n            Paint.FontMetrics fm = paint.getFontMetrics();\n            c.drawText(label, r.centerX(), r.centerY() - (fm.ascent + fm.descent) / 2f, paint);\n        }\n\n        void drawFreeSetup')

          # Pills and tool buttons become quieter when inactive.
          replace_once('            stroke.setStrokeWidth(dp(1.5f));\n            stroke.setColor(on ? accent : Color.rgb(120, 130, 121));',
                       '            stroke.setStrokeWidth(dp(on ? 1.6f : 1.0f));\n            stroke.setColor(on ? accent : Color.rgb(174, 176, 171));')
          replace_once('            paint.setColor(active ? selected : (enabled ? board : Color.rgb(231, 237, 230)));',
                       '            paint.setColor(active ? selected : (enabled ? board : Color.rgb(239, 239, 236)));')
          replace_once('            stroke.setStrokeWidth(dp(active ? 2.2f : 1.4f));',
                       '            stroke.setStrokeWidth(dp(active ? 1.8f : 1.0f));')
          replace_once('            stroke.setColor(active ? accent : (enabled ? Color.rgb(105, 117, 106) : Color.rgb(185, 194, 185)));',
                       '            stroke.setColor(active ? accent : (enabled ? Color.rgb(174, 176, 171) : Color.rgb(205, 206, 202)));')

          # Number tiles should not introduce a second loud green.
          replace_once('                    paint.setColor(Color.rgb(28, 121, 38));', '                    paint.setColor(ink);')

          # Candidate and completion sheets use the neutral soft surface.
          replace_once('            paint.setColor(Color.argb(246, 248, 252, 246));\n            c.drawRect(0, top, w, h, paint);',
                       '            paint.setColor(Color.argb(250, Color.red(soft), Color.green(soft), Color.blue(soft)));\n            c.drawRect(0, top, w, h, paint);')
          replace_once('            paint.setColor(Color.argb(246, 248, 252, 246));\n            c.drawRect(0, sheetTop, w, h, paint);',
                       '            paint.setColor(Color.argb(250, Color.red(soft), Color.green(soft), Color.blue(soft)));\n            c.drawRect(0, sheetTop, w, h, paint);')

          # Selection keeps a soft fill but gains one clear accent outline.
          replace_once('            if (selectedCell != null && selectedCell.equals(pos)) fill = selected;\n            paint.setStyle(Paint.Style.FILL);\n            paint.setColor(fill);\n            c.drawRect(r, paint);\n            c.drawRect(r, stroke);',
                       '            boolean cellSelected = selectedCell != null && selectedCell.equals(pos);\n            if (cellSelected) fill = selected;\n            paint.setStyle(Paint.Style.FILL);\n            paint.setColor(fill);\n            c.drawRect(r, paint);\n            c.drawRect(r, stroke);\n            if (cellSelected) {\n                stroke.setColor(accent);\n                stroke.setStrokeWidth(Math.max(dp(1.8f), cellSize * 0.045f));\n                c.drawRect(r, stroke);\n                stroke.setColor(ink);\n                stroke.setStrokeWidth(Math.max(dp(1.0f), cellSize * 0.035f));\n            }')

          # Neutralize small chrome that currently reads as another green layer.
          text = text.replace('Color.rgb(88, 105, 91)', 'Color.rgb(104, 106, 102)')
          text = text.replace('Color.rgb(108, 119, 110)', 'Color.rgb(126, 127, 123)')
          text = text.replace('Color.rgb(95, 106, 97)', 'Color.rgb(105, 107, 103)')
          text = text.replace('Color.rgb(100, 112, 102)', 'Color.rgb(111, 112, 108)')
          text = text.replace('Color.rgb(118, 128, 119)', 'Color.rgb(137, 138, 134)')

          path.write_text(text)

          build = Path('app/build.gradle')
          gradle = build.read_text()
          if "versionCode 47" not in gradle or "versionName '1.47'" not in gradle:
              raise SystemExit('Unexpected app version before visual pass')
          gradle = gradle.replace('versionCode 47', 'versionCode 48', 1)
          gradle = gradle.replace("versionName '1.47'", "versionName '1.48'", 1)
          build.write_text(gradle)
          PY
          git diff --check
          git diff -- app/src/main/java/com/offline/mathcrossword/MainActivity.java app/build.gradle

      - name: Compile both distribution variants
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Commit tested visual pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offline/mathcrossword/MainActivity.java app/build.gradle
          git commit -m "Polish minimal visual hierarchy"
          git push origin HEAD:product/minimal-ui-pass
