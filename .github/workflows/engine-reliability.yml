name: Engine reliability CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Compile both distribution variants
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Compile reliability harnesses
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          json_jar="$RUNNER_TEMP/json-20240303.jar"
          test -d "$app_classes"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$json_jar" \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          test -s "$json_jar"
          mkdir -p "$RUNNER_TEMP/mathcrossword-reliability"
          javac -cp "$json_jar:$app_classes" \
            -d "$RUNNER_TEMP/mathcrossword-reliability" \
            tools/ReliabilityHarness.java \
            tools/GraphTheoryHarness.java \
            tools/RunLifecycleHarness.java \
            tools/GraphTraversalTelemetryHarness.java \
            tools/SolverInvariantEvidenceHarness.java \
            tools/PathGenerationLatencyHarness.java \
            tools/NetworkGenerationProbe.java \
            tools/HypothesisGenerationProbe.java

      - name: Run lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx256m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.RunLifecycleHarness

      - name: Run graph topology contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx512m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.GraphTheoryHarness

      - name: Run solver-invariant telemetry contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          json_jar="$RUNNER_TEMP/json-20240303.jar"
          java -Xmx256m \
            -cp "$json_jar:$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.GraphTraversalTelemetryHarness
          java -Xmx256m \
            -cp "$json_jar:$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.SolverInvariantEvidenceHarness

      - name: Probe PATH 77-79 generation boundary
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          for level in 77 78 79; do
            timeout 90s java -Xmx1536m \
              -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
              com.offline.mathcrossword.PathGenerationLatencyHarness "$level"
          done

      - name: Probe expert NETWORK generation
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 10m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.NetworkGenerationProbe 12

      - name: Probe HYPOTHESIS Logic 8 generation
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 10m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.HypothesisGenerationProbe 12

      - name: Run deterministic smoke gate
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 12m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.ReliabilityHarness smoke

      - name: Run extended all-generator compatibility sweep
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 12m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.ReliabilityHarness extended
