name: Engine reliability CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: product/post-solve-insights

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply post-solve insight implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('app/src/main/java/com/offline/mathcrossword/SessionTracker.java')
          text = path.read_text()
          text = replace_once(text,
              '            s.eventCount = row.optInt("eventCount", 0);\n            s.ratedLogic = row.optInt("ratedLogic", 0);',
              '            s.eventCount = row.optInt("eventCount", 0);\n            s.firstActionMs = row.optLong("firstActionMs", -1L);\n            s.ratedLogic = row.optInt("ratedLogic", 0);',
              'summary firstAction')
          text = replace_once(text,
              '                s.routeAlternateEntry = routeComparison.optBoolean("alternateEntry", false);\n                s.routeStrongDivergence = routeComparison.optBoolean("strongDivergence", false);\n            }',
              '                s.routeAlternateEntry = routeComparison.optBoolean("alternateEntry", false);\n                s.routeStrongDivergence = routeComparison.optBoolean("strongDivergence", false);\n                JSONObject traversal = routeComparison.optJSONObject("graphTraversal");\n                if (traversal != null && traversal.optBoolean("available", false)) {\n                    s.traversalAvailable = true;\n                    s.traversalDirection = traversal.optString("direction", "unknown");\n                    s.traversalConfidencePct = traversal.optDouble("confidencePct", 0.0);\n                    s.traversalInternalEntry = traversal.optBoolean("internalEntry", false);\n                    s.traversalEntryDepth = traversal.optInt("entryDepth", -1);\n                }\n            }',
              'summary traversal')
          text = replace_once(text,
              '        int eventCount;\n        int ratedLogic;',
              '        int eventCount;\n        long firstActionMs = -1L;\n        int ratedLogic;',
              'summary field firstAction')
          text = replace_once(text,
              '        boolean routeAlternateEntry;\n        boolean routeStrongDivergence;\n    }',
              '        boolean routeAlternateEntry;\n        boolean routeStrongDivergence;\n        boolean traversalAvailable;\n        String traversalDirection;\n        double traversalConfidencePct;\n        boolean traversalInternalEntry;\n        int traversalEntryDepth = -1;\n    }',
              'summary traversal fields')
          path.write_text(text)

          path = Path('app/src/main/java/com/offline/mathcrossword/MainActivity.java')
          text = path.read_text()
          text = replace_once(text,
              '        final RectF hintRect = new RectF();\n        final RectF nextLevelRect = new RectF();\n        final RectF freeGenerateRect = new RectF();',
              '        final RectF hintRect = new RectF();\n        final RectF nextLevelRect = new RectF();\n        final RectF solvedInsightRect = new RectF();\n        final RectF freeGenerateRect = new RectF();',
              'solved insight rect')
          text = replace_once(text,
              '            float solvedDrawerHeight = dp(158) + bottomInset;',
              '            float solvedDrawerHeight = dp(214) + bottomInset;',
              'solved drawer height')

          start = text.index('        void drawSolvedBanner(Canvas c, float w, float h) {')
          end = text.index('        @Override public boolean onTouchEvent(MotionEvent event) {', start)
          new_banner = '''        void drawSolvedBanner(Canvas c, float w, float h) {\n            // Completion stays in reserved space under the board. Reflection is optional,\n            // so the insight action stays secondary to continuing the game.\n            float sheetTop = h - bottomInset - dp(214);\n            drawerHandleRect.setEmpty();\n            bankHits.clear();\n            undoRect.setEmpty(); candidateRect.setEmpty(); hintRect.setEmpty();\n\n            paint.setStyle(Paint.Style.FILL);\n            paint.setColor(Color.argb(250, Color.red(soft), Color.green(soft), Color.blue(soft)));\n            c.drawRect(0, sheetTop, w, h, paint);\n            paint.setColor(Color.argb(22, 0, 0, 0));\n            c.drawRect(0, sheetTop, w, sheetTop + dp(1), paint);\n\n            paint.setColor(ink);\n            paint.setTextAlign(Paint.Align.CENTER);\n            paint.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);\n            paint.setTextSize(dp(16.5f));\n            c.drawText(UiText.tr("Solved ✓", "Готово ✓", "Hotovo ✓"), w / 2f, sheetTop + dp(34), paint);\n\n            float side = dp(38);\n            solvedInsightRect.set(side, sheetTop + dp(55), w - side, sheetTop + dp(99));\n            drawToolButton(c, solvedInsightRect,\n                    UiText.tr("How you solved it", "Как ты решил", "Jak jsi řešil"), true, false);\n\n            nextLevelRect.set(side, sheetTop + dp(119), w - side, h - bottomInset - dp(24));\n            paint.setColor(accent);\n            c.drawRoundRect(nextLevelRect, dp(13), dp(13), paint);\n            paint.setColor(Color.WHITE);\n            paint.setTextSize(dp(17));\n            paint.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);\n            String labelText = generating ? UiText.tr("Generating…", "Генерирую…", "Generuji…")\n                    : (mode == GameMode.PATH ? UiText.tr("Next level  →", "Следующий уровень  →", "Další úroveň  →") : UiText.tr("New puzzle  →", "Новая головоломка  →", "Nový hlavolam  →"));\n            Paint.FontMetrics fm = paint.getFontMetrics();\n            c.drawText(labelText, w / 2f, nextLevelRect.centerY() - (fm.ascent + fm.descent) / 2f, paint);\n        }\n\n'''
          text = text[:start] + new_banner + text[end:]
          text = replace_once(text,
              '            if (solved && nextLevelRect.contains(x, y)) {\n                if (generating) return true;',
              '            if (solved && solvedInsightRect.contains(x, y)) {\n                showPostSolveInsights();\n                return true;\n            }\n            if (solved && nextLevelRect.contains(x, y)) {\n                if (generating) return true;',
              'solved insight touch')

          marker = '        void showLastTrajectoryDialog() {'
          idx = text.index(marker)
          method = '''        void showPostSolveInsights() {\n            SessionTracker.AnalysisSnapshot snapshot = tracker.analyze();\n            if (snapshot.recent.isEmpty() || !snapshot.recent.get(0).solved) {\n                Toast.makeText(getContext(), UiText.tr("No solved trace is available yet", "Пока нет завершённого следа решения", "Zatím není dostupná dokončená stopa řešení"), Toast.LENGTH_SHORT).show();\n                return;\n            }\n            PostSolveInsightBuilder.Result result = PostSolveInsightBuilder.build(snapshot.recent.get(0));\n            StringBuilder body = new StringBuilder();\n            for (String observation : result.observations) {\n                if (body.length() > 0) body.append("\\n\\n");\n                body.append("• ").append(observation);\n            }\n            body.append(UiText.tr(\n                    "\\n\\nThis is an interpretation of your interaction trace, not a literal record of your thoughts.",\n                    "\\n\\nЭто интерпретация следа взаимодействия с задачей, а не буквальная запись твоих мыслей.",\n                    "\\n\\nJde o interpretaci stopy interakce s hlavolamem, ne o doslovný záznam tvých myšlenek."));\n\n            TextView text = new TextView(getContext());\n            int pad = (int) dp(20);\n            text.setPadding(pad, pad, pad, pad);\n            text.setText(body.toString());\n            text.setTextSize(16f);\n            text.setTextColor(ink);\n            text.setLineSpacing(0f, 1.16f);\n            text.setTextIsSelectable(true);\n\n            ScrollView scroll = new ScrollView(getContext());\n            scroll.setFillViewport(true);\n            scroll.addView(text);\n\n            new AlertDialog.Builder(getContext())\n                    .setTitle(UiText.tr("How you solved it", "Как ты решил", "Jak jsi řešil"))\n                    .setView(scroll)\n                    .setPositiveButton(UiText.tr("Done", "Готово", "Hotovo"), null)\n                    .show();\n        }\n\n'''
          text = text[:idx] + method + text[idx:]
          path.write_text(text)

          build = Path('app/build.gradle')
          gradle = build.read_text()
          if "versionCode 48" not in gradle or "versionName '1.48'" not in gradle:
              raise SystemExit('Unexpected app version before post-solve insight work')
          gradle = gradle.replace('versionCode 48', 'versionCode 49', 1)
          gradle = gradle.replace("versionName '1.48'", "versionName '1.49'", 1)
          build.write_text(gradle)

          Path('tools/PostSolveInsightHarness.java').write_text(r'''package com.offline.mathcrossword;

public final class PostSolveInsightHarness {
    public static void main(String[] args) {
        UiText.setLanguageOverride("ru");

        SessionTracker.SessionSummary divergent = new SessionTracker.SessionSummary();
        divergent.solved = true;
        divergent.traversalAvailable = true;
        divergent.traversalDirection = "mixed";
        divergent.traversalConfidencePct = 88.0;
        divergent.routeCompared = true;
        divergent.routeStrongDivergence = true;
        PostSolveInsightBuilder.Result a = PostSolveInsightBuilder.build(divergent);
        require(!a.observations.isEmpty(), "divergent story missing");
        require(a.observations.size() <= 4, "too many observations");
        require(join(a).contains("маршрут"), "route story missing");

        SessionTracker.SessionSummary cascade = new SessionTracker.SessionSummary();
        cascade.solved = true;
        cascade.hidden = 10;
        cascade.maxForcedCascade = 6;
        cascade.rapidCascades = 1;
        cascade.hypothesisEpisodes = 2;
        cascade.candidateCellRevisits = 3;
        cascade.firstActionMs = 18000L;
        PostSolveInsightBuilder.Result b = PostSolveInsightBuilder.build(cascade);
        require(b.observations.size() >= 2 && b.observations.size() <= 4, "signal selection bounds");
        require(join(b).contains("каскад"), "cascade story missing");
        require(join(b).contains("альтернатив"), "hypothesis uncertainty wording missing");

        SessionTracker.SessionSummary quiet = new SessionTracker.SessionSummary();
        quiet.solved = true;
        PostSolveInsightBuilder.Result c = PostSolveInsightBuilder.build(quiet);
        require(c.observations.size() == 1, "quiet solve should have one fallback observation");

        SessionTracker.SessionSummary unfinished = new SessionTracker.SessionSummary();
        unfinished.solved = false;
        require(PostSolveInsightBuilder.build(unfinished).observations.isEmpty(), "unfinished solve must not produce a card");

        System.out.println("PASS post-solve insight contracts");
    }

    private static String join(PostSolveInsightBuilder.Result r) {
        StringBuilder out = new StringBuilder();
        for (String s : r.observations) out.append(s).append('\n');
        return out.toString().toLowerCase(java.util.Locale.ROOT);
    }

    private static void require(boolean condition, String message) {
        if (!condition) throw new AssertionError(message);
    }
}
''')
          PY
          git diff --check

      - name: Compile both distribution variants
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Compile reliability harnesses
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          json_jar="$RUNNER_TEMP/json-20240303.jar"
          test -d "$app_classes"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$json_jar" \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          test -s "$json_jar"
          mkdir -p "$RUNNER_TEMP/mathcrossword-reliability"
          javac -cp "$json_jar:$app_classes" \
            -d "$RUNNER_TEMP/mathcrossword-reliability" \
            tools/ReliabilityHarness.java \
            tools/GraphTheoryHarness.java \
            tools/RunLifecycleHarness.java \
            tools/GraphTraversalTelemetryHarness.java \
            tools/SolverInvariantEvidenceHarness.java \
            tools/PathGenerationLatencyHarness.java \
            tools/NetworkGenerationProbe.java \
            tools/HypothesisGenerationProbe.java \
            tools/MixedGenerationProbe.java \
            tools/AdversarialMrvBenchmark.java \
            tools/ChainAdversarialFrontierProbe.java \
            tools/PostSolveInsightHarness.java

      - name: Run lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx256m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.RunLifecycleHarness

      - name: Run graph topology contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx512m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.GraphTheoryHarness

      - name: Run solver-invariant telemetry contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          json_jar="$RUNNER_TEMP/json-20240303.jar"
          java -Xmx256m \
            -cp "$json_jar:$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.GraphTraversalTelemetryHarness
          java -Xmx256m \
            -cp "$json_jar:$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.SolverInvariantEvidenceHarness

      - name: Run post-solve insight contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx256m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.PostSolveInsightHarness

      - name: Run adversarial MRV benchmark
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 8m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.AdversarialMrvBenchmark 6

      - name: Probe CHAIN L10 adversarial frontier
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 6m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.ChainAdversarialFrontierProbe 24

      - name: Probe PATH 77-79 generation boundary
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          for level in 77 78 79; do
            timeout 90s java -Xmx1536m \
              -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
              com.offline.mathcrossword.PathGenerationLatencyHarness "$level"
          done

      - name: Probe expert NETWORK generation
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 10m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.NetworkGenerationProbe 12

      - name: Probe HYPOTHESIS Logic 8 generation
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 10m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.HypothesisGenerationProbe 12

      - name: Probe MIXED Logic 10 generation
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 10m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.MixedGenerationProbe 12

      - name: Run deterministic smoke gate
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 12m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.ReliabilityHarness smoke

      - name: Run extended all-generator compatibility sweep
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 12m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.ReliabilityHarness extended

      - name: Commit tested implementation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offline/mathcrossword/SessionTracker.java \
                  app/src/main/java/com/offline/mathcrossword/MainActivity.java \
                  app/build.gradle \
                  tools/PostSolveInsightHarness.java
          git commit -m "Add player-facing post-solve insights"
          git push origin HEAD:product/post-solve-insights
