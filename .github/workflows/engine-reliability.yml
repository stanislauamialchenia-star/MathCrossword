name: Engine reliability CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Compile both distribution variants
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Compile reliability harnesses
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          test -d "$app_classes"
          mkdir -p "$RUNNER_TEMP/mathcrossword-reliability"
          javac -cp "$app_classes" \
            -d "$RUNNER_TEMP/mathcrossword-reliability" \
            tools/ReliabilityHarness.java \
            tools/GraphTheoryHarness.java \
            tools/RunLifecycleHarness.java \
            tools/GraphTraversalTelemetryHarness.java \
            tools/SolverInvariantEvidenceHarness.java

      - name: Run lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx256m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.RunLifecycleHarness

      - name: Run graph topology contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx512m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.GraphTheoryHarness

      - name: Run solver-invariant telemetry contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx256m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.GraphTraversalTelemetryHarness
          java -Xmx256m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.SolverInvariantEvidenceHarness

      - name: Run deterministic smoke gate
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 12m java -Xmx1536m \
            -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" \
            com.offline.mathcrossword.ReliabilityHarness smoke
