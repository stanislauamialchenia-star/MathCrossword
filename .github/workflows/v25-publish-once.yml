name: Publish v25 source once

on:
  push:
    branches:
      - v25-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v5
        with:
          ref: v25-publish
          fetch-depth: 0

      - name: Apply v25 candidate-visibility patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check v25_patch/apply.patch
          git apply v25_patch/apply.patch
          rm -rf v25_patch
          rm -f .github/workflows/v25-publish-once.yml

      - name: Publish clean v25 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MathCrossword v25: always-visible candidate notes"
          git push origin HEAD:main
