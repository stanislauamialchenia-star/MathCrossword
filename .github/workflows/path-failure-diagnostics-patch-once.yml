name: Add PATH failure diagnostics once

on:
  push:
    branches:
      - research/cascade-shape-policy
    paths:
      - '.github/workflows/path-failure-diagnostics-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch reliability diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research/cascade-shape-policy
          git checkout -B research/cascade-shape-policy origin/research/cascade-shape-policy
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/ReliabilityHarness.java')
          s = p.read_text()
          old = '''    private static Puzzle timedPath(int level) {\n        long t0 = System.nanoTime();\n        Puzzle p = PuzzleGenerator.generatePath(level);\n        recordGeneration(t0, "PATH L" + level, p, 0);\n        return p;\n    }\n'''
          new = '''    private static Puzzle timedPath(int level) {\n        long t0 = System.nanoTime();\n        try {\n            Puzzle p = PuzzleGenerator.generatePath(level);\n            recordGeneration(t0, "PATH L" + level, p, 0);\n            return p;\n        } catch (RuntimeException ex) {\n            GenerationDiagnostics d = PuzzleGenerator.lastDiagnostics();\n            if (d != null) {\n                System.err.println("PATH L" + level + " generation failed"
                        + " · attempts=" + d.candidateAttempts\n                        + " · rejects=" + d.compactSummary()\n                        + " · stages=" + d.stageSummary());\n            }\n            throw ex;\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('timedPath marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git add tools/ReliabilityHarness.java
          git commit -m "Print PATH diagnostics on reliability failures"
          git push origin HEAD:research/cascade-shape-policy
