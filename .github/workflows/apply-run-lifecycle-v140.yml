name: Apply PuzzleRun lifecycle v1.40

on:
  push:
    branches:
      - agent/puzzlerun-visits-v140
    paths:
      - tools/apply_run_lifecycle_v140.py
      - app/src/main/java/com/offline/mathcrossword/RunLifecycle.java
      - app/src/main/java/com/offline/mathcrossword/ResearchExporter.java
      - .github/workflows/apply-run-lifecycle-v140.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/puzzlerun-visits-v140
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply exact lifecycle migration
        run: python3 tools/apply_run_lifecycle_v140.py

      - name: Compile both distribution variants
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Compile lifecycle harness
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          mkdir -p "$RUNNER_TEMP/mathcrossword-lifecycle"
          javac -cp "$app_classes" -d "$RUNNER_TEMP/mathcrossword-lifecycle" tools/RunLifecycleHarness.java

      - name: Run lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -cp "$app_classes:$RUNNER_TEMP/mathcrossword-lifecycle" com.offline.mathcrossword.RunLifecycleHarness

      - name: Run reliability smoke gate
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          mkdir -p "$RUNNER_TEMP/mathcrossword-reliability"
          javac -cp "$app_classes" -d "$RUNNER_TEMP/mathcrossword-reliability" tools/ReliabilityHarness.java
          timeout 12m java -Xmx1536m -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" com.offline.mathcrossword.ReliabilityHarness smoke

      - name: Commit generated production files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/build.gradle
            app/src/main/java/com/offline/mathcrossword/MainActivity.java
            app/src/main/java/com/offline/mathcrossword/SessionTracker.java
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Add PuzzleRun and Visit lifecycle telemetry"
          git push origin HEAD:agent/puzzlerun-visits-v140
