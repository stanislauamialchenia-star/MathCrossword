name: Apply in-memory PuzzleRun resume v1.41

on:
  push:
    branches:
      - agent/resume-puzzlerun-v141
    paths:
      - tools/apply_resume_run_v141.py
      - .github/workflows/apply-resume-run-v141.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/resume-puzzlerun-v141
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply exact resume migration
        run: python3 tools/apply_resume_run_v141.py

      - name: Compile both distribution variants
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugJavaWithJavac :app:compilePlayDebugJavaWithJavac --no-daemon

      - name: Compile reliability harnesses
        shell: bash
        run: |
          set -euo pipefail
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          mkdir -p "$RUNNER_TEMP/mathcrossword-reliability"
          javac -cp "$app_classes" -d "$RUNNER_TEMP/mathcrossword-reliability" \
            tools/RunLifecycleHarness.java tools/ReliabilityHarness.java tools/GraphTheoryHarness.java

      - name: Run lifecycle contracts
        shell: bash
        run: |
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" com.offline.mathcrossword.RunLifecycleHarness

      - name: Run graph contracts
        shell: bash
        run: |
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          java -Xmx512m -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" com.offline.mathcrossword.GraphTheoryHarness

      - name: Run deterministic smoke gate
        shell: bash
        run: |
          app_classes="app/build/intermediates/javac/githubDebug/compileGithubDebugJavaWithJavac/classes"
          timeout 12m java -Xmx1536m -cp "$app_classes:$RUNNER_TEMP/mathcrossword-reliability" com.offline.mathcrossword.ReliabilityHarness smoke

      - name: Commit generated production files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/build.gradle
            app/src/main/java/com/offline/mathcrossword/MainActivity.java
            app/src/main/java/com/offline/mathcrossword/SessionTracker.java
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Resume the same PuzzleRun after Home"
          git push origin HEAD:agent/resume-puzzlerun-v141

# Branch-only migration workflow; removed before merge.
