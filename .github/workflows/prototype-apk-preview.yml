name: Prototype APK preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  apk:
    if: startsWith(github.head_ref, 'prototype/') || github.head_ref == 'ux/discoverable-clear'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Build non-debug GitHub APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleGithubRelease --no-daemon
          apk_path="$(find app/build/outputs/apk/github/release -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcrossword-signing.keystore"
          chmod 600 "$RUNNER_TEMP/mathcrossword-signing.keystore"
          keytool -list -keystore "$RUNNER_TEMP/mathcrossword-signing.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Align and sign preview APK with production GitHub key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          "$zipalign" -f -p 4 "$APK_PATH" "$RUNNER_TEMP/preview-aligned.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/mathcrossword-signing.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/MathCrossword-prototype.apk" \
            "$RUNNER_TEMP/preview-aligned.apk"
          "$apksigner" verify "$RUNNER_TEMP/MathCrossword-prototype.apk"

      - name: Upload installable prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: MathCrossword-prototype-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/MathCrossword-prototype.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mathcrossword-signing.keystore" "$RUNNER_TEMP/preview-aligned.apk" "$RUNNER_TEMP/MathCrossword-prototype.apk"