          insert = anchor + '''                if (last.routeCompared) {\n                    String routeLine = "маршрут: согласование "\n                            + String.format(Locale.US, "%.0f%%", last.routeAgreementPct)\n                            + " · начало " + String.format(Locale.US, "%.0f%%", last.routeEarlyAgreementPct)\n                            + " · порядок " + String.format(Locale.US, "%.0f%%", last.routeOrderAgreementPct);\n                    c.drawText(routeLine, side, y, paint);\n                    y += dp(21);\n                }\n'''
          if anchor not in s: raise SystemExit('MainActivity last trajectory route anchor not found')
          s = s.replace(anchor, insert, 1)

          s = s.replace('return info.versionName == null ? "1.31" : info.versionName;', 'return info.versionName == null ? "1.32" : info.versionName;', 1)
          s = s.replace('return "1.31";', 'return "1.32";', 1)
          s = s.replace('return 31L;', 'return 32L;', 1)
          path.write_text(s, encoding='utf-8')

          # ---- App version ----
          path = Path('app/build.gradle')
          s = path.read_text(encoding='utf-8')
          if "versionCode 31" not in s or "versionName '1.31'" not in s:
              raise SystemExit('Expected v1.31 build.gradle not found')
          s = s.replace('versionCode 31', 'versionCode 32', 1)
          s = s.replace("versionName '1.31'", "versionName '1.32'", 1)
          path.write_text(s, encoding='utf-8')

          Path('V32_ROUTE_COMPARISON.md').write_text('''# MathCrossword v1.32 — HumanSolver route comparison\n\n- Adds `HumanRouteComparator`: a deterministic route model built from the same domain propagation and depth-1/depth-2 contradiction checks used by HumanSolver.\n- Forced cells are represented as waves, not an arbitrary strict order, to avoid false disagreement when several cells are simultaneously forced.\n- Each finished local session now stores the model route and compares it with the order of meaningful cells actually touched by the player (candidate edits, placements and removals).\n- Comparison metrics: early-entry agreement, order agreement, early arrival at model probe/pivot cells, backward transitions, alternate entry, alternate order and conservative strong-divergence flag.\n- The compact Analysis screen shows aggregate route agreement; `Последняя траектория → подробно` shows model route vs observed route and explicit model-check signals.\n- This is not a thought recorder or personality classifier. It compares one algorithmic route with an interaction trace so alternative solution paths and analyzer blind spots become visible.\n- Puzzle generation is unchanged; generator v22 remains the mathematical baseline.\n''', encoding='utf-8')
          PY

      - name: Compile v32 before publishing
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Commit v32 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offline/mathcrossword/HumanRouteComparator.java \
                  app/src/main/java/com/offline/mathcrossword/SessionTracker.java \
                  app/src/main/java/com/offline/mathcrossword/MainActivity.java \
                  app/build.gradle V32_ROUTE_COMPARISON.md
          git commit -m "MathCrossword v32: compare solver and player routes"
          git push origin HEAD:main
