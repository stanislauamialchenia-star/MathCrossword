name: Publish v32 route comparison once

on:
  push:
    branches: [v27-ui-publish]
    paths:
      - .github/workflows/v32-route-compare-publish-once.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch v32 human route comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---- New deterministic route model + conservative route comparator ----
          route = r'''package com.offline.mathcrossword;

import static com.offline.mathcrossword.PuzzleModel.*;

import org.json.JSONArray;
import org.json.JSONObject;

import java.util.ArrayList;
import java.util.HashMap;
import java.util.HashSet;
import java.util.LinkedHashMap;
import java.util.List;
import java.util.Map;
import java.util.Set;

/**
 * Compares one deterministic HumanSolver route with the order of meaningful cells
 * actually touched by the player. It does not claim to reconstruct thought: the
 * output is only a model-vs-interaction comparison used to find blind spots.
 */
final class HumanRouteComparator {
    static final int VERSION = 1;
    private static final int MAX_MODEL_STEPS = 48;

    private HumanRouteComparator() { }

    static JSONArray modelRoute(Puzzle p) {
        JSONArray out = new JSONArray();
        if (p == null || p.hidden.isEmpty()) return out;

        HumanSolver.State state = HumanSolver.initialState(p);
        HumanSolver.Metrics scratch = new HumanSolver.Metrics();
        int guard = 0;

        while (state.assigned.size() < p.hidden.size() && guard++ < MAX_MODEL_STEPS) {
            Map<Pos, Set<Integer>> domains = HumanSolver.allDomains(p, state);
            if (domains.isEmpty()) break;
            boolean impossible = false;
            for (Set<Integer> d : domains.values()) if (d.isEmpty()) { impossible = true; break; }
            if (impossible) break;

            List<Map.Entry<Pos, Set<Integer>>> singles = new ArrayList<>();
            for (Map.Entry<Pos, Set<Integer>> e : domains.entrySet()) {
                if (e.getValue().size() == 1) singles.add(e);
            }
            singles.sort((a, b) -> {
                int c = Integer.compare(a.getKey().y, b.getKey().y);
                return c != 0 ? c : Integer.compare(a.getKey().x, b.getKey().x);
            });

            if (!singles.isEmpty()) {
                JSONArray cells = new JSONArray();
                boolean ok = true;
                for (Map.Entry<Pos, Set<Integer>> e : singles) {
                    int value = e.getValue().iterator().next();
                    cells.put(cell(e.getKey(), value));
                    if (!HumanSolver.assign(state, e.getKey(), value)) { ok = false; break; }
                }
                putStep(out, "forced-wave", 0, cells, state.assigned.size());
                if (!ok || !HumanSolver.allLocallyPossible(p, state)) break;
                continue;
            }

            HumanSolver.Deduction d = null;
            for (int depth = 1; depth <= 2 && d == null; depth++) {
                d = HumanSolver.findContradictionDeduction(p, state, domains, depth, scratch);
            }
            if (d == null) break;
            JSONArray cells = new JSONArray();
            cells.put(cell(d.pos, d.value));
            putStep(out, "probe", d.depth, cells, state.assigned.size() + 1);
            if (!HumanSolver.assign(state, d.pos, d.value) || !HumanSolver.allLocallyPossible(p, state)) break;
        }
        return out;
    }

    static JSONObject compare(JSONArray modelRoute, JSONArray events) {
        JSONObject out = new JSONObject();
        try {
            out.put("version", VERSION);
            int modelSteps = modelRoute == null ? 0 : modelRoute.length();
            JSONArray actual = actualDecisionRoute(events);
            out.put("modelSteps", modelSteps);
            out.put("actualCells", actual.length());
            out.put("actualDecisionRoute", actual);

            Map<String, Integer> stepByCell = new LinkedHashMap<>();
            List<String> probeCells = new ArrayList<>();
            if (modelRoute != null) {
                for (int i = 0; i < modelRoute.length(); i++) {
                    JSONObject step = modelRoute.optJSONObject(i);
                    if (step == null) continue;
                    boolean probe = "probe".equals(step.optString("kind", ""));
                    JSONArray cells = step.optJSONArray("cells");
                    if (cells == null) continue;
                    for (int j = 0; j < cells.length(); j++) {
                        JSONObject c = cells.optJSONObject(j);
                        if (c == null) continue;
                        String key = key(c.optInt("x"), c.optInt("y"));
                        if (!stepByCell.containsKey(key)) stepByCell.put(key, i);
                        if (probe && !probeCells.contains(key)) probeCells.add(key);
                    }
                }
            }

            boolean available = modelSteps > 0 && actual.length() > 0 && !stepByCell.isEmpty();
            out.put("available", available);
            out.put("modelDistinctCells", stepByCell.size());
            out.put("modelProbeCells", probeCells.size());
            if (!available) return out;

            int earlyN = Math.min(5, actual.length());
            int earlyLimitStep = Math.min(2, modelSteps - 1);
            int earlyHits = 0;
            int mapped = 0;
            int firstStep = -1;
            int previousStep = -1;
            int comparableTransitions = 0;
            int orderedTransitions = 0;
            int backwardTransitions = 0;
            int maxJumpAhead = 0;
            Map<String, Integer> actualIndex = new HashMap<>();

            for (int i = 0; i < actual.length(); i++) {
                JSONObject a = actual.optJSONObject(i);
                if (a == null) continue;
                String k = key(a.optInt("x"), a.optInt("y"));
                actualIndex.put(k, i);
                Integer step = stepByCell.get(k);
                if (step == null) continue;
                a.put("modelStep", step);
                mapped++;
                if (firstStep < 0) firstStep = step;
                if (i < earlyN && step <= earlyLimitStep) earlyHits++;
                if (i < earlyN) maxJumpAhead = Math.max(maxJumpAhead, step);
                if (previousStep >= 0) {
                    comparableTransitions++;
                    if (step >= previousStep) orderedTransitions++;
                    else backwardTransitions++;
                }
                previousStep = step;
            }

            double earlyPct = earlyN == 0 ? 0.0 : 100.0 * earlyHits / earlyN;
            double orderPct = comparableTransitions == 0 ? 100.0 : 100.0 * orderedTransitions / comparableTransitions;
            int probeEarly = 0;
            int probeSeen = 0;
            int earlyCutoff = Math.max(1, (int)Math.ceil(actual.length() * 0.60));
            for (String probe : probeCells) {
                Integer idx = actualIndex.get(probe);
                if (idx == null) continue;
                probeSeen++;
                if (idx < earlyCutoff) probeEarly++;
            }
            double probeEarlyPct = probeCells.isEmpty() ? -1.0 : 100.0 * probeEarly / probeCells.size();
            double mappedPct = actual.length() == 0 ? 0.0 : 100.0 * mapped / actual.length();

            double agreement;
            if (probeCells.isEmpty()) agreement = 0.48 * earlyPct + 0.52 * orderPct;
            else agreement = 0.38 * earlyPct + 0.42 * orderPct + 0.20 * Math.max(0.0, probeEarlyPct);
            agreement = Math.max(0.0, Math.min(100.0, agreement));

            out.put("mappedActualPct", mappedPct);
            out.put("firstModelStep", firstStep);
            out.put("earlyAgreementPct", earlyPct);
            out.put("orderAgreementPct", orderPct);
            out.put("probeReachedEarlyPct", probeEarlyPct);
            out.put("probeSeen", probeSeen);
            out.put("backwardTransitions", backwardTransitions);
            out.put("maxEarlyStepJump", maxJumpAhead);
            out.put("agreementPct", agreement);
            out.put("divergencePct", 100.0 - agreement);
            out.put("alternateEntry", firstStep < 0 || firstStep > 2);
            out.put("alternateOrder", comparableTransitions >= 2 && orderPct < 65.0);
            out.put("strongDivergence", actual.length() >= 3 && agreement < 55.0);
        } catch (Exception ignored) { }
        return out;
    }

    static String describeModel(JSONArray route, int maxSteps) {
        if (route == null || route.length() == 0) return "—";
        StringBuilder s = new StringBuilder();
        int limit = Math.min(Math.max(1, maxSteps), route.length());
        for (int i = 0; i < limit; i++) {
            JSONObject step = route.optJSONObject(i);
            if (step == null) continue;
            if (s.length() > 0) s.append(" → ");
            String kind = step.optString("kind", "");
            int depth = step.optInt("depth", 0);
            s.append("probe".equals(kind) ? ("H" + depth) : "F");
            JSONArray cells = step.optJSONArray("cells");
            s.append("{");
            if (cells != null) {
                int cellLimit = Math.min(4, cells.length());
                for (int j = 0; j < cellLimit; j++) {
                    if (j > 0) s.append(",");
                    JSONObject c = cells.optJSONObject(j);
                    if (c != null) s.append("[").append(c.optInt("x")).append(",").append(c.optInt("y")).append("]");
                }
                if (cells.length() > cellLimit) s.append("…+").append(cells.length() - cellLimit);
            }
            s.append("}");
        }
        if (route.length() > limit) s.append(" → …+").append(route.length() - limit);
        return s.toString();
    }

    static String describeActual(JSONObject comparison, int maxCells) {
        if (comparison == null) return "—";
        JSONArray route = comparison.optJSONArray("actualDecisionRoute");
        if (route == null || route.length() == 0) return "—";
        StringBuilder s = new StringBuilder();
        int limit = Math.min(Math.max(1, maxCells), route.length());
        for (int i = 0; i < limit; i++) {
            JSONObject c = route.optJSONObject(i);
            if (c == null) continue;
            if (s.length() > 0) s.append(" → ");
            s.append("[").append(c.optInt("x")).append(",").append(c.optInt("y")).append("]");
        }
        if (route.length() > limit) s.append(" → …+").append(route.length() - limit);
        return s.toString();
    }

    private static JSONArray actualDecisionRoute(JSONArray events) {
        JSONArray out = new JSONArray();
        if (events == null) return out;
        Set<String> seen = new HashSet<>();
        for (int i = 0; i < events.length(); i++) {
            JSONObject e = events.optJSONObject(i);
            if (e == null) continue;
            String type = e.optString("type", "");
            if (!"candidate_add".equals(type) && !"candidate_remove".equals(type)
                    && !"place".equals(type) && !"remove".equals(type)) continue;
            if (!e.has("x") || !e.has("y")) continue;
            int x = e.optInt("x"), y = e.optInt("y");
            String key = key(x, y);
            if (!seen.add(key)) continue;
            JSONObject a = new JSONObject();
            try {
                a.put("x", x);
                a.put("y", y);
                a.put("tMs", e.optLong("tMs", 0L));
                a.put("firstType", type);
            } catch (Exception ignored) { }
            out.put(a);
        }
        return out;
    }

    private static JSONObject cell(Pos pos, int value) {
        JSONObject c = new JSONObject();
        try {
            c.put("x", pos.x);
            c.put("y", pos.y);
            c.put("value", value);
        } catch (Exception ignored) { }
        return c;
    }

    private static void putStep(JSONArray out, String kind, int depth, JSONArray cells, int assignedAfter) {
        JSONObject step = new JSONObject();
        try {
            step.put("index", out.length());
            step.put("kind", kind);
            step.put("depth", depth);
            step.put("cells", cells);
            step.put("assignedAfter", assignedAfter);
        } catch (Exception ignored) { }
        out.put(step);
    }

    private static String key(int x, int y) { return x + ":" + y; }
}
'''
          Path('app/src/main/java/com/offline/mathcrossword/HumanRouteComparator.java').write_text(route, encoding='utf-8')

          # ---- SessionTracker: persist model route and compare it at session finish ----
          path = Path('app/src/main/java/com/offline/mathcrossword/SessionTracker.java')
          s = path.read_text(encoding='utf-8')

          anchor = '''    synchronized void event(String type, int x, int y, int value, String detail) {\n        if (open != null) open.event(type, x, y, value, detail);\n    }\n\n'''
          insert = anchor + '''    synchronized void setModelRoute(JSONArray route) {\n        if (open != null) open.setModelRoute(route);\n    }\n\n'''
          if anchor not in s: raise SystemExit('SessionTracker event anchor not found')
          s = s.replace(anchor, insert, 1)

          anchor = '''            if (row.optBoolean("contradictionKernel", false)) {\n                out.kernelSessions++;\n                if (row.optInt("contradictionKernelDeepBranches", 0) > 0\n                        || row.optInt("contradictionKernelDepth", 0) >= 4) out.deepKernelSessions++;\n            }\n'''
          insert = anchor + '''            JSONObject routeComparison = row.optJSONObject("routeComparison");\n            if (routeComparison != null && routeComparison.optBoolean("available", false)) {\n                out.routeComparedSessions++;\n                if (routeComparison.optBoolean("strongDivergence", false)) out.routeStrongDivergences++;\n                if (routeComparison.optBoolean("alternateEntry", false)) out.routeAlternateEntries++;\n                out.routeAgreementTotal += routeComparison.optDouble("agreementPct", 0.0);\n            }\n'''
          if anchor not in s: raise SystemExit('SessionTracker analyze route anchor not found')
          s = s.replace(anchor, insert, 1)

          anchor = '''        out.avgLongestPauseMs = pauseCount == 0 ? 0L : totalLongestPause / pauseCount;\n\n'''
          insert = '''        out.avgLongestPauseMs = pauseCount == 0 ? 0L : totalLongestPause / pauseCount;\n        out.avgRouteAgreementPct = out.routeComparedSessions == 0 ? 0.0\n                : out.routeAgreementTotal / out.routeComparedSessions;\n\n'''
          if anchor not in s: raise SystemExit('SessionTracker average anchor not found')
          s = s.replace(anchor, insert, 1)

          anchor = '''            s.maxCandidatesInOneCell = row.optInt("maxCandidatesInOneCell", 0);\n            out.recent.add(s);\n'''
          insert = '''            s.maxCandidatesInOneCell = row.optInt("maxCandidatesInOneCell", 0);\n            JSONObject routeComparison = row.optJSONObject("routeComparison");\n            if (routeComparison != null && routeComparison.optBoolean("available", false)) {\n                s.routeCompared = true;\n                s.routeAgreementPct = routeComparison.optDouble("agreementPct", 0.0);\n                s.routeEarlyAgreementPct = routeComparison.optDouble("earlyAgreementPct", 0.0);\n                s.routeOrderAgreementPct = routeComparison.optDouble("orderAgreementPct", 0.0);\n                s.routeAlternateEntry = routeComparison.optBoolean("alternateEntry", false);\n                s.routeStrongDivergence = routeComparison.optBoolean("strongDivergence", false);\n            }\n            out.recent.add(s);\n'''
          if anchor not in s: raise SystemExit('SessionTracker recent route anchor not found')
          s = s.replace(anchor, insert, 1)

          anchor = '''        out.append("\\n\\nСигналы для проверки модели");\n'''
          route_report = r'''        JSONObject routeComparison = row.optJSONObject("routeComparison");
        if (routeComparison != null && routeComparison.optBoolean("available", false)) {
            out.append("\n\nМаршрут HumanSolver ↔ прохождение")
                    .append("\nСогласование: ")
                    .append(String.format(java.util.Locale.US, "%.0f%%", routeComparison.optDouble("agreementPct", 0.0)))
                    .append(" · начало ")
                    .append(String.format(java.util.Locale.US, "%.0f%%", routeComparison.optDouble("earlyAgreementPct", 0.0)))
                    .append(" · порядок ")
                    .append(String.format(java.util.Locale.US, "%.0f%%", routeComparison.optDouble("orderAgreementPct", 0.0)));
            double probePct = routeComparison.optDouble("probeReachedEarlyPct", -1.0);
            if (probePct >= 0.0) out.append(" · pivot вовремя ")
                    .append(String.format(java.util.Locale.US, "%.0f%%", probePct));
            out.append("\nМодель: ").append(HumanRouteComparator.describeModel(row.optJSONArray("modelRoute"), 10));
            out.append("\nПрохождение: ").append(HumanRouteComparator.describeActual(routeComparison, 14));
        }

'''
          if anchor not in s: raise SystemExit('SessionTracker report signal anchor not found')
          s = s.replace(anchor, route_report + anchor, 1)

          anchor = '''        if (revisits >= 3) {\n            out.append("\\n• Частые возвраты к уже исследованным клеткам — проверить, это содержательный узел задачи или визуальная/интерфейсная неоднозначность.");\n            signal = true;\n        }\n'''
          insert = anchor + r'''        if (routeComparison != null && routeComparison.optBoolean("available", false)) {
            double routeAgreement = routeComparison.optDouble("agreementPct", 100.0);
            int firstModelStep = routeComparison.optInt("firstModelStep", -1);
            boolean routeSolved = row.optBoolean("solved", false);
            if (routeSolved && routeComparison.optBoolean("strongDivergence", false)) {
                out.append("\n• Задача решена по порядку, слабо похожему на маршрут HumanSolver — сильный кандидат на альтернативный путь решения.");
                signal = true;
            }
            if (routeComparison.optBoolean("alternateEntry", false)) {
                out.append("\n• Первые содержательные действия вошли в задачу не через ранние шаги HumanSolver")
                        .append(firstModelStep >= 0 ? (" (первое совпадение: шаг модели " + (firstModelStep + 1) + ").") : ".");
                signal = true;
            }
            if (routeComparison.optBoolean("alternateOrder", false) && routeAgreement >= 45.0) {
                out.append("\n• Игрок использовал знакомые модели узлы, но в заметно другом порядке — проверить независимые фронты и порядок дедукций.");
                signal = true;
            }
            if (routeAgreement >= 78.0 && !routeComparison.optBoolean("alternateEntry", false)) {
                out.append("\n• Порядок прохождения хорошо согласуется с текущим маршрутом HumanSolver.");
                signal = true;
            }
        }
'''
          if anchor not in s: raise SystemExit('SessionTracker revisits anchor not found')
          s = s.replace(anchor, insert, 1)

          anchor = '''        int deepKernelSessions;\n        boolean calibrationReady;\n'''
          insert = '''        int deepKernelSessions;\n        int routeComparedSessions;\n        int routeStrongDivergences;\n        int routeAlternateEntries;\n        double routeAgreementTotal;\n        double avgRouteAgreementPct;\n        boolean calibrationReady;\n'''
          if anchor not in s: raise SystemExit('AnalysisSnapshot route fields anchor not found')
          s = s.replace(anchor, insert, 1)

          anchor = '''        int maxCandidatesInOneCell;\n    }\n\n    private static final class OpenSession {\n'''
          insert = '''        int maxCandidatesInOneCell;\n        boolean routeCompared;\n        double routeAgreementPct;\n        double routeEarlyAgreementPct;\n        double routeOrderAgreementPct;\n        boolean routeAlternateEntry;\n        boolean routeStrongDivergence;\n    }\n\n    private static final class OpenSession {\n'''
          if anchor not in s: raise SystemExit('SessionSummary route fields anchor not found')
          s = s.replace(anchor, insert, 1)

