name: Publish v32 route comparison once

on:
  push:
    branches: [v27-ui-publish]
    paths:
      - .github/workflows/v32-route-compare-publish-once.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load v32 patch scripts
        shell: bash
        run: |
          git fetch origin v27-ui-publish
          git show origin/v27-ui-publish:tools/v32_patch.py > /tmp/v32_patch.py
          git show origin/v27-ui-publish:tools/v32_patch_fix.py > /tmp/v32_patch_fix.py
      - name: Patch v32
        shell: bash
        run: |
          python3 /tmp/v32_patch_fix.py
          python3 /tmp/v32_patch.py
      - name: Compile v32 before publishing
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon
      - name: Commit v32 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offline/mathcrossword/HumanRouteComparator.java \
                  app/src/main/java/com/offline/mathcrossword/SessionTracker.java \
                  app/src/main/java/com/offline/mathcrossword/MainActivity.java \
                  app/build.gradle V32_ROUTE_COMPARISON.md
          git commit -m "MathCrossword v32: compare solver and player routes"
          git push origin HEAD:main
