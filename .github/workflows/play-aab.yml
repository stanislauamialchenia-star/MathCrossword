name: Build signed Google Play AAB

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          version_code="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build Play release bundle
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew bundlePlayRelease --no-daemon

      - name: Verify Play manifest has no sideload permission
        shell: bash
        run: |
          manifest="$(find app/build/intermediates/merged_manifest/playRelease -type f -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          if grep -q 'REQUEST_INSTALL_PACKAGES' "$manifest"; then
            echo 'Play manifest unexpectedly contains REQUEST_INSTALL_PACKAGES' >&2
            exit 1
          fi

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcrossword-upload.keystore"
          chmod 600 "$RUNNER_TEMP/mathcrossword-upload.keystore"
          keytool -list -keystore "$RUNNER_TEMP/mathcrossword-upload.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Sign AAB with upload key
        id: bundle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          input="$(find app/build/outputs/bundle/playRelease -type f -name '*.aab' | head -n 1)"
          test -n "$input"
          output="MathCrossword-v${{ steps.version.outputs.name }}-play.aab"
          cp "$input" "$output"
          jarsigner -keystore "$RUNNER_TEMP/mathcrossword-upload.keystore" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$output" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$output" > /dev/null
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload Play Console artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathCrossword-v${{ steps.version.outputs.name }}-play-aab
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mathcrossword-upload.keystore"
