name: Apply post-solve insight card

on:
  push:
    branches:
      - product/post-solve-insights

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: product/post-solve-insights

      - name: Verify runner
        run: echo "post-solve integration runner is active"
