name: Apply post-solve insight card

on:
  push:
    branches:
      - product/post-solve-insights

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: product/post-solve-insights

      - name: Verify runner write access
        shell: bash
        run: |
          set -euo pipefail
          echo "runner active $(date -u +%s)" > tools/post-solve-runner-proof.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/post-solve-runner-proof.txt
          git commit -m "Verify post-solve integration runner"
          git push origin HEAD:product/post-solve-insights
