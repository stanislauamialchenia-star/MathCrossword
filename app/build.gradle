plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.mathcrossword'
    compileSdk 36

    // One codebase, two distribution channels: direct GitHub APK and Google Play AAB.
    flavorDimensions 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
        }
        play {
            dimension 'distribution'
        }
    }

    defaultConfig {
        applicationId 'com.offline.mathcrossword'
        minSdk 23
        targetSdk 36
        // v1.60 promotes the unified solution workbench and visual Solution Library onboarding to stable.
        versionCode 60
        versionName '1.60'
    }
}