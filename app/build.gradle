plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.mathcrossword'
    compileSdk 36

    // One codebase, two distribution channels: direct GitHub APK and Google Play AAB.
    flavorDimensions 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
        }
        play {
            dimension 'distribution'
        }
    }

    defaultConfig {
        applicationId 'com.offline.mathcrossword'
        minSdk 23
        targetSdk 36
        // v1.51 makes removal of a selected placed number explicit and discoverable.
        versionCode 51
        versionName '1.51'
    }
}