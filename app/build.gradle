plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.mathcrossword'
    compileSdk 36

    // One codebase, two distribution channels: direct GitHub APK and Google Play AAB.
    flavorDimensions 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
        }
        play {
            dimension 'distribution'
        }
    }

    defaultConfig {
        applicationId 'com.offline.mathcrossword'
        minSdk 23
        targetSdk 36
        // Prototype-only version bump: unified workbench is now the only in-game bottom surface.
        versionCode 55
        versionName '1.55-preview'
    }
}